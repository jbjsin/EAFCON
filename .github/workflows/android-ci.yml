name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDevDebugUnitTest

      - name: Assemble development APK
        run: ./gradlew :app:assembleDevDebug

      - name: Build production bundle
        run: ./gradlew :app:bundleProdRelease

      - name: Run development and production lint
        run: ./gradlew :app:lintDevDebug :app:lintVitalProdRelease
